project:
  type: book
  output-dir: docs
  resources:
    - slides/

book:
  title: "Introduction to SAS"
  subtitle: "MA505"
  # author: "Your Name"
  chapters:
    - index.qmd
    - chapters/01-intro-to-sas.ipynb
    # To publish a draft: move it from _drafts/ into chapters/ and list it here, e.g.
    # - chapters/02-tables-libraries.ipynb

# Notebooks are NOT re-run when the book is built.
# The SAS output saved in each .ipynb is what shows up.
execute:
  enabled: false

format:
  html:
    theme: cosmo
    css: annotations.css
    include-after-body: copy-code.html
    toc: true
    code-copy: true
    highlight-style: github
