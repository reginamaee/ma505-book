<script>
// Adds two small icons to the top-right of every SAS code panel:
//   [download .sas]  [copy to clipboard]
// Works for the annotated blocks (boxes/arrows) and for plain code cells.
document.addEventListener('DOMContentLoaded', function () {
  var ICON_COPY = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/><path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg>';
  var ICON_DOWNLOAD = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>';
  var ICON_DONE = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/></svg>';
  var GREY = '#57606a', DARK = '#24292f', GREEN = '#1a7f37';

  function makeButton(icon, label, onClick) {
    var b = document.createElement('button');
    b.type = 'button'; b.title = label; b.setAttribute('aria-label', label); b.innerHTML = icon;
    // inline styles so the look never depends on a cached stylesheet
    b.style.cssText = 'width:30px;height:30px;padding:0;margin:0;display:flex;align-items:center;justify-content:center;' +
      'border:1px solid #d0d7de;border-radius:6px;background:#ffffff;color:' + GREY + ';cursor:pointer;opacity:.85;line-height:0;box-shadow:none;';
    b.addEventListener('mouseenter', function () { b.style.opacity = '1'; b.style.color = DARK; });
    b.addEventListener('mouseleave', function () { b.style.opacity = '.85'; b.style.color = GREY; });
    b.addEventListener('click', function () { onClick(b, icon, label); });
    return b;
  }
  function flash(b, icon, label) {
    b.innerHTML = ICON_DONE; b.style.color = GREEN;
    setTimeout(function () { b.innerHTML = icon; b.style.color = GREY; b.title = label; }, 1500);
  }
  function fileName(host) {
    var page = (location.pathname.split('/').pop() || 'code').replace(/\.html?$/, '');
    var sec = host.closest('section[id]');
    return page + (sec ? '_' + sec.id : '') + '.sas';
  }
  function addTools(host, getText) {
    var bar = document.createElement('div');
    bar.className = 'sas-code-tools';
    bar.style.cssText = 'position:absolute;top:6px;right:6px;z-index:2;display:flex;gap:6px;';
    bar.appendChild(makeButton(ICON_DOWNLOAD, 'Download .sas file', function (b, icon, label) {
      var blob = new Blob([getText() + '\n'], { type: 'text/plain' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = fileName(host);
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      flash(b, icon, label);
    }));
    bar.appendChild(makeButton(ICON_COPY, 'Copy code', function (b, icon, label) {
      var text = getText();
      var done = function () { flash(b, icon, label); };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done);
      } else {
        var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); ta.remove(); done();
      }
    }));
    host.style.position = 'relative';
    host.appendChild(bar);
  }
  function clean(pre) {
    var c = pre.cloneNode(true);
    c.querySelectorAll('.sas-code-tools, .code-copy-button').forEach(function (x) { x.remove(); });
    // reveal.js line numbers live in separate elements; textContent of <code> skips them
    var code = c.querySelector('code') || c;
    return code.textContent.replace(/^\n+|\n+$/g, '');
  }
  // annotated blocks: one pair of icons for the whole code panel
  document.querySelectorAll('.anno').forEach(function (block) {
    var pres = block.querySelectorAll('pre.anno-code');
    if (!pres.length) return;
    addTools(pres[0], function () { return Array.prototype.map.call(pres, clean).join('\n\n'); });
  });
  // plain code cells (replace Quarto's own copy button, if any, so every panel looks the same)
  var seen = [];
  document.querySelectorAll('.cell-code').forEach(function (el) {
    var pre = el.tagName === 'PRE' ? el : el.querySelector('pre');
    if (!pre) return;
    var host = pre.closest('div.sourceCode') || pre;
    if (seen.indexOf(host) !== -1) return; seen.push(host);
    // newer Quarto puts its own copy button next to the code (in a wrapper), not inside it
    var wrap = pre.closest('.code-copy-outer-scaffold') || host;
    wrap.querySelectorAll('.code-copy-button').forEach(function (x) { x.style.display = 'none'; });
    addTools(host, function () { return clean(pre); });
  });

  // Scratchpads: Tab inserts spaces; keys typed here never move the slides
  document.querySelectorAll('.scratchpad').forEach(function (pad) {
    var ta = pad.querySelector('textarea');
    ta.addEventListener('keydown', function (e) {
      e.stopPropagation();
      if (e.key === 'Tab') {
        e.preventDefault();
        var s = ta.selectionStart, t = ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(t);
        ta.selectionStart = ta.selectionEnd = s + 4;
      }
    });
    var clear = pad.querySelector('button.clear');
    if (clear) clear.addEventListener('click', function () { ta.value = ''; ta.focus(); });
  });

  // Slides only: on slides that have SAS code, reveal each piece on click,
  // in order: text -> code -> output
  if (document.querySelector('.reveal .slides')) {
    document.querySelectorAll('.reveal .slides section').forEach(function (sec) {
      if (!sec.querySelector('.cell')) return;
      Array.prototype.forEach.call(sec.children, function (el) {
        if (/^H[1-6]$/.test(el.tagName) || el.classList.contains('fragment') || el.querySelector('.fragment')) return;
        if (el.classList.contains('cell')) {
          var code = el.querySelector('.code-copy-outer-scaffold') || el.querySelector('div.sourceCode') || el.querySelector('pre.cell-code');
          if (code) code.classList.add('fragment');
          el.querySelectorAll('.cell-output-display, .cell-output').forEach(function (o) { o.classList.add('fragment'); });
        } else {
          el.classList.add('fragment');
        }
      });
    });
    if (window.Reveal && Reveal.isReady && Reveal.isReady()) Reveal.sync();
  }

  // Book only: sections marked {.solution} are hidden behind a "Show solution" toggle
  if (!document.querySelector('.reveal .slides')) {
    document.querySelectorAll('section.solution').forEach(function (sec) {
      var h = sec.querySelector(':scope > h1, :scope > h2, :scope > h3');
      var d = document.createElement('details'); d.className = 'solution-toggle';
      var sm = document.createElement('summary');
      sm.textContent = (h && /answer/i.test(h.textContent)) ? 'Show answers' : 'Show solution';
      d.appendChild(sm);
      Array.prototype.slice.call(sec.children).forEach(function (x) { if (x !== h) d.appendChild(x); });
      sec.appendChild(d);
    });
  }
});
</script>
